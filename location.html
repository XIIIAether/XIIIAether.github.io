<!DOCTYPE html>
<html>
  <head>
    <title>Location</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Navigation bar */
      nav {
        background-color: #333;
        padding: 10px 20px;
        display: flex;
        align-items: center;
      }

      /* Logo image */
      .logo img {
        height: 40px;
        width: auto;
      }

      /* Container for nav links */
      .nav-links {
        margin-left: auto;
      }

      /* Navigation links */
      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }

      .nav-links a:hover {
        text-decoration: underline;
      }

      /* Page content */
      .content {
        padding: 20px;
      }

      /* Location details */
      .location-info {
        margin-bottom: 20px;
      }

      .map {
        width: 100%;
        max-width: 600px;
        height: 300px;
        background-color: #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
      }
    </style>
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav>
      <div class="logo">
        <img src="logo.png" alt="Website Logo">
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="location.html">Location</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="content">
      <h1>Our Location</h1>

      <div class="location-info">
        <p><strong>Address:</strong> 123 Main Street, Your City, Country</p>
        <p><strong>Hours:</strong> Monday – Friday, 9:00 AM – 6:00 PM</p>
        <p><strong>Phone:</strong> (123) 456-7890</p>
      </div>

      <!-- Placeholder map -->
      <div class="map">
        Map goes here
        
      </div>
    </div>
  </body>
</html>
