<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Contact - Chillspot</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- ALL INLINE STYLE DELETED -->
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav style="z-index: 1000; position: relative;">
      <div class="logo">
        <img src="logo.png" alt="Chillspot Contact" style="height: 45px; border-radius: 8px;">
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="location.html">Location</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <!-- WRAP IN .container -->
    <div class="container">
      <h1>Get In Touch</h1>
      <p>Questions? Reservations? Let's talk.</p>

      <div class="contact-grid">
        <!-- Contact Info Card -->
        <div class="contact-card">
          <h3>📞 Quick Contact</h3>
          <p><strong>Phone:</strong> +63 999 123 4567</p>
          <p><strong>Email:</strong> hello@chillspot.ph</p>
          <p><strong>Address:</strong> 123 Foodie Street<br>Cebu City, Philippines 6000</p>
        </div>

        <!-- Social Links Card -->
        <div class="social-card">
          <h3>🌐 Follow Us</h3>
          <a href="https://facebook.com/chillspotph" target="_blank" class="social-btn fb">
            <span>Facebook</span>
          </a>
          <a href="https://m.me/chillspotph" target="_blank" class="social-btn messenger">
            <span>Messenger</span>
          </a>
          <a href="https://instagram.com/chillspotph" target="_blank" class="social-btn ig">
            <span>Instagram</span>
          </a>
        </div>

        <!-- Contact Form Card -->
        <div class="form-card">
          <h3>✉️ Send Message</h3>
          <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
